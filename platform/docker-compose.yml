# Meta Architectural Authority — platform compose skeleton (Phase 0).
#
# Only the always-on Security Core control plane runs now. The Archive data
# stores (pgvector + Neo4j, TZ §II.3.3/§II.3.4) are left as COMMENTED, profiled
# placeholders — they belong to the Archive floor-piece and must NOT be brought
# up live yet. Bring the control plane up with:
#
#   PLATFORM_TOKEN=... docker compose -f platform/docker-compose.yml up control-plane
#
# The control plane binds to loopback only; publish nothing to 0.0.0.0.

services:
  control-plane:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "platform/control-plane/index.js"]
    environment:
      # Required. Supply out-of-band (shell env / secrets manager), never commit.
      PLATFORM_TOKEN: "${PLATFORM_TOKEN:?set PLATFORM_TOKEN}"
      PLATFORM_HOST: "127.0.0.1"
      PLATFORM_PORT: "8787"
      PLATFORM_DATA_DIR: "/app/platform/.data"
      # Gate-0 canary tripwire — off unless explicitly enabled (TZ §II.14).
      PLATFORM_GATE0: "${PLATFORM_GATE0:-off}"
      PLATFORM_GATE0_TARGETS: "${PLATFORM_GATE0_TARGETS:-}"
      # Auto-stop on anomaly — off at threshold 0 (TZ §II.4.2).
      PLATFORM_AUTOSTOP_THRESHOLD: "${PLATFORM_AUTOSTOP_THRESHOLD:-0}"
      PLATFORM_AUTOSTOP_WINDOW_MS: "${PLATFORM_AUTOSTOP_WINDOW_MS:-60000}"
    volumes:
      - ../:/app:ro
      - platform_data:/app/platform/.data
    # Loopback only — do NOT add a public "ports:" mapping.
    network_mode: "none"
    restart: unless-stopped

  # --- Archive data stores (Archive floor-piece, TZ §II.3.3/§II.3.4/§22) ------
  # The platform's memory brain: pgvector (semantic search over reference
  # METADATA) + Neo4j (Domain->Unit->Level graph). These are gated behind the
  # "archive" COMPOSE PROFILE, so a plain `docker compose up` does NOT start
  # them — nothing here is enabled by default. Until the DBs are provisioned the
  # Archive is dry-run only:
  #
  #   python platform/archive_ingestion/ingest_archive.py \
  #       --json platform/archive/unified_ai_hacker_mind_v5.json --dry-run
  #
  # Bring the stores up only when provisioning for real:
  #   PG_PASSWORD=... NEO4J_PASSWORD=... \
  #     docker compose -f platform/docker-compose.yml --profile archive up pgvector neo4j
  # Then apply schemas (schema.sql / neo4j_schema.cypher) before ingesting.
  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["archive"]          # off unless `--profile archive` — not enabled by default
    environment:
      POSTGRES_DB: aegis_archive
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: "${PG_PASSWORD:?set PG_PASSWORD}"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    # Loopback only — do NOT publish to 0.0.0.0. Reach it from the host via the
    # compose network or an explicit 127.0.0.1 port binding when needed.
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    profiles: ["archive"]          # off unless `--profile archive` — not enabled by default
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  platform_data:
  pgvector_data:
  neo4j_data:
