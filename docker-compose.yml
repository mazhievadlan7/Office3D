# Office3D with Hermes Agent — single-host deployment.
#
#   cp .env.example .env     # set STUDIO_ACCESS_TOKEN and the HERMES_* secrets
#   docker compose up -d
#   docker compose exec hermes hermes setup   # once: models and provider keys
#
# Only Office3D is published, and only on loopback. For your own domain with
# HTTPS, turn on the `https` profile (COMPOSE_PROFILES=https and
# OFFICE3D_DOMAIN in .env): the caddy service then serves it on 80/443. Hermes' API and dashboard stay on the internal network: the
# dashboard's plugin routes (the kanban board) do not check credentials by
# design, so they must never be reachable from outside.
#
# See docs/hermes-platform.md for the architecture and docs/deployment.md for
# the walkthrough.

services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-v2026.9.21}
    container_name: office3d-hermes
    restart: unless-stopped
    # s6-overlay supervises the gateway (and every profile it serves) and the
    # dashboard inside the container; keep the image's own entrypoint.
    command: ["gateway", "run"]
    # A model served on this machine (Ollama, vLLM, LM Studio…) is reached at
    # http://host.docker.internal:<port>/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # OpenAI-compatible API server: runs, sessions, jobs. Hermes refuses to
      # start it without a key of at least 16 characters.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      # One gateway serves every profile (= office agent) under /p/<profile>/.
      # Hermes only turns this on by itself for an install that already has
      # several profiles; a fresh one would leave new agents unreachable.
      GATEWAY_MULTIPLEX_PROFILES: "true"
      # Dashboard backend: profile lifecycle, per-profile .env, kanban. Bound
      # to loopback, where it accepts the machine session token; hermes-gate
      # below is the only way in from the network.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_TOKEN:?set HERMES_DASHBOARD_TOKEN in .env}
    volumes:
      - hermes-data:/opt/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      # Checked every few seconds while starting, so an update is judged fast.
      start_interval: 5s
      retries: 3
    deploy:
      resources:
        limits:
          # Browser, terminal and code tools run inside this container.
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The door to the dashboard. It shares the hermes container's network
  # namespace, so it reaches the loopback-bound dashboard, and forwards only
  # requests that carry the session token — plugin routes included, which the
  # dashboard itself leaves open. Same image as office3d, different command.
  hermes-gate:
    build: .
    image: office3d:local
    container_name: office3d-hermes-gate
    restart: unless-stopped
    network_mode: "service:hermes"
    depends_on:
      hermes:
        condition: service_started
    command: ["node", "server/hermes-gate.js"]
    environment:
      HERMES_DASHBOARD_TOKEN: ${HERMES_DASHBOARD_TOKEN:?set HERMES_DASHBOARD_TOKEN in .env}
      HERMES_GATE_PORT: "9120"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9120/gate/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  office3d:
    # Build locally by default. To run the image published by CI instead,
    # replace `build` with `image: ghcr.io/mazhievadlan7/office3d:main` here
    # and in hermes-gate.
    build: .
    image: office3d:local
    container_name: office3d
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_started
      hermes-gate:
        condition: service_started
    environment:
      # The server refuses to bind a public host without this token, so there
      # is no way to start it unauthenticated by accident.
      STUDIO_ACCESS_TOKEN: ${STUDIO_ACCESS_TOKEN:?set STUDIO_ACCESS_TOKEN in .env}
      HOST: 0.0.0.0
      PORT: "3000"
      OPENCLAW_STATE_DIR: /data
      # Only caddy and the host itself reach this port, and caddy overwrites
      # X-Forwarded-For with the client's address: login throttling uses it.
      TRUSTED_PROXY: "1"
      TRUSTED_PROXY_HOSTS: caddy
      # Hermes, reached over the internal network.
      HERMES_API_URL: http://hermes:8642
      HERMES_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      # hermes-gate listens inside the hermes container's network namespace,
      # so it answers on the hermes host name.
      HERMES_DASHBOARD_URL: http://hermes:9120
      HERMES_DASHBOARD_TOKEN: ${HERMES_DASHBOARD_TOKEN:?set HERMES_DASHBOARD_TOKEN in .env}
      OFFICE3D_HERMES_KEY_SECRET: ${OFFICE3D_HERMES_KEY_SECRET:?set OFFICE3D_HERMES_KEY_SECRET in .env}
      # Office3D's MCP server (team tools for the agents). Hermes reaches it
      # over the backend network; the port is deliberately not published.
      OFFICE3D_MCP_HOST: 0.0.0.0
      OFFICE3D_MCP_PORT: "3010"
      OFFICE3D_MCP_URL: http://office3d:3010
      # Hermes updates from the office ("Обновить / Позже"), through the
      # updater service below.
      OFFICE3D_UPDATER_URL: http://updater:3020
      OFFICE3D_UPDATER_TOKEN: ${OFFICE3D_UPDATER_TOKEN:?set OFFICE3D_UPDATER_TOKEN in .env}
      # Autonomy's active hours and daily budget follow this zone.
      OFFICE3D_TIMEZONE: ${OFFICE3D_TIMEZONE:-}
      # Where OAuth sign-in pages of MCP servers send the browser back
      # (<this>/oauth/mcp/<server>). Empty: the address the office is opened on.
      OFFICE3D_PUBLIC_URL: ${OFFICE3D_PUBLIC_URL:-}
      # Alerts when part of the deployment fails (see .env.example).
      ALERT_NTFY_URL: ${ALERT_NTFY_URL:-}
      ALERT_NTFY_TOKEN: ${ALERT_NTFY_TOKEN:-}
      ALERT_SMTP_URL: ${ALERT_SMTP_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_HEARTBEAT_URL: ${ALERT_HEARTBEAT_URL:-}
      # Backend selection. Empty means Hermes (HERMES_API_URL is set above);
      # set openclaw plus OFFICE3D_GATEWAY_URL to switch back.
      OFFICE3D_GATEWAY_ADAPTER_TYPE: ${OFFICE3D_GATEWAY_ADAPTER_TYPE:-}
      OFFICE3D_GATEWAY_URL: ${OFFICE3D_GATEWAY_URL:-}
      OFFICE3D_GATEWAY_TOKEN: ${OFFICE3D_GATEWAY_TOKEN:-}
      # Gateway hosts the proxy may reach (comma-separated host names). In
      # production the proxy refuses every upstream while this is empty, so
      # set it together with OFFICE3D_GATEWAY_URL; the built-in Hermes does
      # not need it. CUSTOM_RUNTIME_ALLOWLIST does the same for
      # /api/runtime/custom and falls back to this list.
      UPSTREAM_ALLOWLIST: ${UPSTREAM_ALLOWLIST:-}
      CUSTOM_RUNTIME_ALLOWLIST: ${CUSTOM_RUNTIME_ALLOWLIST:-}
      # Voice (speech recognition and the HQ's voices): the speech gateway
      # below (`speech` profile), reached over the speech network. See
      # docs/deployment.md, "Голос".
      SPEECH_GATEWAY_URL: ${SPEECH_GATEWAY_URL:-http://speech:8765}
      OFFICE3D_SYSTEM_VOICE: ${OFFICE3D_SYSTEM_VOICE:-}
      # Or another OpenAI-compatible voice server (see .env.example).
      OFFICE3D_STT_PROVIDER: ${OFFICE3D_STT_PROVIDER:-}
      OFFICE3D_TTS_PROVIDER: ${OFFICE3D_TTS_PROVIDER:-}
      OFFICE3D_VOICE_API_URL: ${OFFICE3D_VOICE_API_URL:-}
      OFFICE3D_STT_API_URL: ${OFFICE3D_STT_API_URL:-}
      OFFICE3D_TTS_API_URL: ${OFFICE3D_TTS_API_URL:-}
      OFFICE3D_VOICE_API_KEY: ${OFFICE3D_VOICE_API_KEY:-}
      OFFICE3D_STT_MODEL: ${OFFICE3D_STT_MODEL:-}
      OFFICE3D_TTS_MODEL: ${OFFICE3D_TTS_MODEL:-}
      OFFICE3D_TTS_VOICE: ${OFFICE3D_TTS_VOICE:-}
      OFFICE3D_TTS_VOICES: ${OFFICE3D_TTS_VOICES:-}
      OFFICE3D_STT_LANGUAGE: ${OFFICE3D_STT_LANGUAGE:-}
    # Published on loopback only; a reverse proxy terminates TLS in front.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - office3d-state:/data
    networks:
      - backend
      - edge
      - control
      - speech
    # The image declares its own HEALTHCHECK; this only shortens the grace
    # period used while the container is starting.
    healthcheck:
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Hermes updates: pulls a new image, backs up the Hermes data, switches
  # HERMES_IMAGE_TAG in .env, restarts hermes and hermes-gate, checks they
  # answer, and rolls back (image and data) when they do not. The only
  # container with the Docker socket; it is not published and answers only
  # office3d's token. See docs/hermes-gateway.md.
  updater:
    build:
      context: .
      target: updater
    image: office3d-updater:local
    container_name: office3d-updater
    restart: unless-stopped
    environment:
      OFFICE3D_UPDATER_TOKEN: ${OFFICE3D_UPDATER_TOKEN:?set OFFICE3D_UPDATER_TOKEN in .env}
      PROJECT_DIR: /project
      HERMES_DATA_DIR: /hermes-data
      BACKUP_DIR: /backups
      # Daily backups of Hermes and the office (scripts/office3d-backup.sh).
      OFFICE_STATE_DIR: /office-state
      BACKUP_TIME: ${BACKUP_TIME-03:30}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-${OFFICE3D_TIMEZONE:-}}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Hermes is judged by its Docker health checks: this service is not on
      # the agents' network.
      HEALTH_CONTAINERS: hermes,hermes-gate
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose project itself: the tag it switches lives in .env.
      - ./:/project
      - hermes-data:/hermes-data
      - hermes-backups:/backups
      # Read for backups, written only by a restore.
      - office3d-state:/office-state
    networks:
      - control
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Speech (optional, `speech` profile: COMPOSE_PROFILES=speech, or
  # speech,https): the office's speech gateway (services/speech, MIT) on its
  # own network, not published. Silero TTS v5 speaks every voice (the system,
  # AM7, the crew) with exact Russian stress; GigaAM recognises speech. CPU
  # only: no GPU is needed.
  speech:
    build: ./services/speech
    image: office3d-speech:local
    container_name: office3d-speech
    restart: unless-stopped
    profiles: ["speech"]
    environment:
      # Listens on the container network (the port is not published); the
      # gateway refuses a non-loopback address without this switch.
      SPEECH_HOST: 0.0.0.0
      SPEECH_ALLOW_NON_LOOPBACK: "1"
      SPEECH_PORT: "8765"
      OFFICE3D_SPEECH_HOME: /data
      SILERO_DEVICE: cpu
      SILERO_THREADS: ${SILERO_THREADS:-4}
      # GigaAM speech recognition; int8 keeps it well inside the memory limit.
      SPEECH_STT_QUANTIZATION: ${SPEECH_STT_QUANTIZATION:-int8}
    volumes:
      # Silero weights and the speech cache.
      - speech-data:/data
    networks:
      - speech
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS for your own domain: gets and renews the Let's Encrypt certificate
  # and forwards to office3d. Runs with the `https` profile.
  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2.11-alpine}
    container_name: office3d-caddy
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      office3d:
        condition: service_healthy
    environment:
      OFFICE3D_DOMAIN: ${OFFICE3D_DOMAIN:-}
    # Refuses to start without a domain rather than serving a default site.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'test -n "$$OFFICE3D_DOMAIN" || { echo "Set OFFICE3D_DOMAIN in .env (for example office.example.com)." >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Four networks keep each part to what it needs:
  #   backend: office3d and Hermes (agents' tools run here);
  #   edge:    caddy and office3d;
  #   control: office3d and the updater, which holds the Docker socket and is
  #            thus kept away from the agents' network;
  #   speech:  office3d and the speech gateway (speech profile).
  # A plain bridge network: Hermes needs internet access for model providers
  # and tools, so it cannot be `internal: true`. Nothing on it is published
  # except Office3D's port above.
  backend:
  edge:
  control:
  speech:

volumes:
  # All Hermes state: profiles (agents), memory, sessions, skills, kanban.
  # Back it up; see docs/deployment.md.
  hermes-data:
  office3d-state:
  # Backups: daily ones (daily/<id>/, the last BACKUP_KEEP) and the ones the
  # updater takes before each Hermes update (the last 3). Copy it off the
  # server; see docs/deployment.md.
  hermes-backups:
  # Caddy's certificates and ACME account. Keep it: re-issuing on every
  # start would soon hit Let's Encrypt's rate limits.
  caddy-data:
  caddy-config:
  # Speech models (Silero, GigaAM) and the speech cache.
  speech-data:
