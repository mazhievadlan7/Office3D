# VoiceStudio on an NVIDIA GPU (needs the NVIDIA Container Toolkit):
#
#   COMPOSE_PROFILES=speech docker compose -f docker-compose.yml -f docker-compose.speech-gpu.yml up -d
#
# Silero stays on the CPU: it is fast there and leaves the GPU to VoxCPM2.
services:
  voicestudio:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
