name: CI

# Runs on every push to main (lint, typecheck, tests, then the images are
# published), on version tags, on pull requests (checks only) and by hand.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref. Tag runs are never
# cancelled, since they publish release images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is assembled in the "Prepare Docker tags" step rather than here:
  # GHCR requires a lowercase namespace, `github.repository_owner` preserves the
  # owner's original casing, and `env:` cannot lowercase a value.
  NODE_VERSION: "24"

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Translations
        run: node scripts/i18n-check.mjs

      - name: Documentation links
        run: node scripts/check-doc-links.mjs

  publish:
    name: Build and publish ${{ matrix.image }}
    # Gated on verify so a red suite never reaches the registry. Pull requests
    # are verified but not published: the image would be unused and the
    # GITHUB_TOKEN of a fork PR cannot write packages anyway.
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The office itself (serves the UI, the Hermes adapter and hermes-gate).
          - image: office3d
            target: runner
          # The isolated service that updates Hermes and rolls it back.
          - image: office3d-updater
            target: updater
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          tags=()
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${REGISTRY}/${owner}/${IMAGE}"
          ref_name="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/_' '-' | tr -cd 'a-z0-9.-')"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("${IMAGE_NAME}:main")
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            tags+=("${IMAGE_NAME}:${ref_name}")
          fi
          # Every published build also gets an immutable tag of its commit, so
          # a deployment can pin it and roll back to it.
          tags+=("${IMAGE_NAME}:sha-${GITHUB_SHA::12}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tags+=("${IMAGE_NAME}:${version}")
            tags+=("${IMAGE_NAME}:latest")
          fi
          {
            echo "value<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # amd64 only: arm64 needs QEMU emulation here and roughly doubles the
          # billed minutes, which a private repository pays for. Add
          # linux/arm64 back if a deployment target needs it.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
